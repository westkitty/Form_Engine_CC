# Deploys the static editor to GitHub Pages. MANUAL ONLY (workflow_dispatch): nothing is published until a
# maintainer runs it and has enabled Pages (Settings → Pages → Source: GitHub Actions).
# Action pins follow the Vite static-deploy guide (vite.dev/guide/static-deploy, checked 2026-10-21).
name: Deploy FORM//ENGINE to Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # relative base ('./') already works on nested paths; set BASE_PATH=/<repo>/ for absolute URLs
          BASE_PATH: ./
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./dist
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
